						belt: new Tone.NoiseSynth({
							noise: { type: "white" },
							envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.02 },
						}).connect(percussionGain),
						rotator: new Tone.Synth({
							oscillator: { type: "triangle" },
							envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 },
						}).connect(fxGain),
						zap: new Tone.NoiseSynth({
							noise: { type: "white" },
							envelope: { attack: 0.001, decay: 0.06, sustain: 0, release: 0.02 },
						}).connect(percussionGain),
						pulse: new Tone.Synth({
							oscillator: { type: "square" },
							envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 },
						}).connect(fxGain),
					},
					drums: {
						kick: new Tone.MembraneSynth({
							pitchDecay: 0.04,
							octaves: 6,
							envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.06 },
						}).connect(drumsGain),
						snare: new Tone.NoiseSynth({
							noise: { type: "white" },
							envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.04 },
						}).connect(drumsGain),
						hihat: new Tone.NoiseSynth({
							noise: { type: "white" },
							envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.01 },
						}).connect(drumsGain),
					},
					coin: new Tone.Synth({
						oscillator: { type: "square" },
						envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.04 },
					}).connect(fxGain),
					explosion: {
						thump: new Tone.MembraneSynth({
							pitchDecay: 0.08,
							octaves: 4,
							envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.1 },
						}).connect(percussionGain),
						noise: new Tone.NoiseSynth({
							noise: { type: "brown" },
							envelope: { attack: 0.002, decay: 0.35, sustain: 0, release: 0.08 },
						}).connect(percussionGain),
						crackle: new Tone.NoiseSynth({
							noise: { type: "white" },
							envelope: { attack: 0.001, decay: 0.18, sustain: 0, release: 0.04 },
						}).connect(percussionGain),
					},
					mixer: {
						master: masterGain,
						melody: melodyGain,
						botB: botBGain,
						percussion: percussionGain,
						fx: fxGain,
						drums: drumsGain,
					},
				};
				} catch (error) {
					state.message = "Audio build error (fallback): " + (error && error.message ? error.message : "unknown");
					const limiter = new Tone.Limiter(-6).toDestination();
					const masterGain = new Tone.Gain(state.mixer.master).connect(limiter);
					const melodyGain = new Tone.Gain(state.mixer.melody).connect(masterGain);
					const bassLP = new Tone.Filter({ type: "lowpass", frequency: 1400, rolloff: -12 });
					const botBGain = new Tone.Gain(state.mixer.botB).connect(bassLP);
					bassLP.connect(masterGain);
					const percussionGain = new Tone.Gain(state.mixer.percussion).connect(masterGain);
					const fxGain = new Tone.Gain(state.mixer.fx).connect(masterGain);
					const drumsGain = new Tone.Gain(state.mixer.drums).connect(masterGain);
					const hallReverb = new Tone.Reverb({ decay: 1.2, wet: 1.0, preDelay: 0.01 });
					hallReverb.generate();
					const reverbSend = new Tone.Gain(0.45).connect(hallReverb);
					hallReverb.connect(fxGain);
					melodyGain.connect(reverbSend);
					percussionGain.connect(reverbSend);
					fxGain.connect(reverbSend);
					return {
						botA: {
							main: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.003, decay: 0.14, sustain: 0.06, release: 0.08 } }).connect(melodyGain),
							ping: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.003, decay: 0.06, sustain: 0, release: 0.04 } }).connect(melodyGain),
							arp: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.002, decay: 0.04, sustain: 0, release: 0.03 } }).connect(melodyGain),
						},
						botB: {
							fm: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.005, decay: 0.5, sustain: 0.7, release: 0.3 } }).connect(botBGain),
							sub: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.008, decay: 0.4, sustain: 0.5, release: 0.2 } }).connect(botBGain),
							arp: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.002, decay: 0.05, sustain: 0, release: 0.03 } }).connect(botBGain),
							noise: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 } }).connect(percussionGain),
						},
						fx: {
							collision: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.06, sustain: 0, release: 0.02 } }).connect(fxGain),
							belt: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.02 } }).connect(percussionGain),
							rotator: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 } }).connect(fxGain),
							zap: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 } }).connect(percussionGain),
							pulse: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 } }).connect(fxGain),
						},
						drums: {
							kick: new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 6, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.06 } }).connect(drumsGain),
							snare: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.04 } }).connect(drumsGain),
							hihat: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.01 } }).connect(drumsGain),
						},
						coin: new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.04 } }).connect(fxGain),
						explosion: {
							thump: new Tone.MembraneSynth({ pitchDecay: 0.08, octaves: 4, envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.1 } }).connect(percussionGain),
							noise: new Tone.NoiseSynth({ noise: { type: "brown" }, envelope: { attack: 0.002, decay: 0.35, sustain: 0, release: 0.08 } }).connect(percussionGain),
							crackle: new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.18, sustain: 0, release: 0.04 } }).connect(percussionGain),
						},
						mixer: {
							master: masterGain,
							melody: melodyGain,
							botB: botBGain,
							percussion: percussionGain,
							fx: fxGain,
							drums: drumsGain,
						},
					};
				}
			}

			function applyMixer() {
				if (!audio || !audio.mixer || !window.Tone) {
					return;
				}
				audio.mixer.master.gain.rampTo(state.mixer.master, 0.05);
				audio.mixer.melody.gain.rampTo(state.mixer.melody, 0.05);
				audio.mixer.botB.gain.rampTo(state.mixer.botB, 0.05);
				audio.mixer.percussion.gain.rampTo(state.mixer.percussion, 0.05);
				audio.mixer.fx.gain.rampTo(state.mixer.fx, 0.05);
				if (audio.mixer.drums) audio.mixer.drums.gain.rampTo(state.mixer.drums, 0.05);
			}

			function setMixerValue(key, value) {
				if (!Object.prototype.hasOwnProperty.call(state.mixer, key)) {
					return;
				}
				state.mixer[key] = clampNumber(value, 0, 1, DEFAULT_MIXER[key]);
				applyMixer();
				saveState();
				queueRender();
			}

			function ensureScheduler() {
				if (schedulerId !== null) {
					return;
				}
				schedulerId = Tone.Transport.scheduleRepeat((time) => {
					advanceSequence(time);
				}, "16n");
			}

			function hardStopTransportAndAudio() {
				if (window.Tone) {
					if (schedulerId !== null) {
						Tone.Transport.clear(schedulerId);
						schedulerId = null;
					}
					Tone.Transport.stop();
					Tone.Transport.cancel(0);
					Tone.Transport.position = 0;
				}
				panicAudioOutputs();
			}

			async function armAudio() {
				if (!window.Tone) {
					state.message = "Tone.js did not load, so the robots are mute.";
					queueRender();
					return;
				}
				try {
					await Tone.start();
					/* Increase lookahead so audio events are scheduled
					   well ahead of when they play — prevents jitter
					   from DOM rendering on the main thread. */
					Tone.context.lookAhead = 0.25;
					if (typeof Tone.context.updateInterval === "number") {
						Tone.context.updateInterval = 0.03;
					}
					state.message = "Tone ctx: " + Tone.context.state + ". Building audio...";
					queueRender();
					if (!audio) {
						audio = buildAudio();
					}
					applyMixer();
					Tone.Transport.bpm.value = getPlaybackBpm();
					ensureScheduler();
					/* Diagnostic beep — confirms end-to-end audio output */
					try {
						const beep = new Tone.Synth({
							oscillator: { type: "triangle" },
							envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.04 },
						}).toDestination();
						beep.triggerAttackRelease("C5", 0.1, Tone.now(), 0.35);
						setTimeout(() => { try { beep.dispose(); } catch (_) {} }, 500);
					} catch (_beepErr) { /* non-critical */ }
					state.transportReady = true;
					state.message = "Audio armed (ctx: " + Tone.context.state + "). Tap PLAY.";
					queueRender();
				} catch (error) {
					state.message = "Audio wake-up failed: " + (error && error.message ? error.message : "unknown error") + ".";
					queueRender();
				}
			}

			function resetBoardState(withMessage) {
				state.boardState = createBoardState();
				state.currentStep = -1;
				state.moveTick = 0;
				state.drumTick = 0;
				state.voiceModIndex = 0;
				state.voiceModResetCount = 0;
				state.voiceModStepCount = 0;
				state.cycle = 0;
				if (withMessage) {
					state.message = "Board reset to start positions.";
				}
			}

			async function startPlayback() {
				const requestId = ++playbackRequestId;
				state.startingPlayback = true;
				queueRender();
				await armAudio();
				if (!state.transportReady || requestId !== playbackRequestId) {
					state.startingPlayback = false;
					queueRender();
					return;
				}
				resetBoardState(false);
				hardStopTransportAndAudio();
				ensureScheduler();
				if (audio?.mixer && window.Tone) {
					const now = Tone.now();
					audio.mixer.master.gain.cancelScheduledValues(now);
					audio.mixer.master.gain.setValueAtTime(state.mixer.master, now);
					audio.mixer.melody.gain.setValueAtTime(state.mixer.melody, now);
					audio.mixer.botB.gain.setValueAtTime(state.mixer.botB, now);
					audio.mixer.percussion.gain.setValueAtTime(state.mixer.percussion, now);
					audio.mixer.fx.gain.setValueAtTime(state.mixer.fx, now);
				}
				applyMixer();
				state.startingPlayback = false;
				state.playing = true;
				state.message = "Loop running.";
				try {
					Tone.Transport.start();
				} catch (error) {
					state.playing = false;
					state.message = "Transport start failed: " + (error && error.message ? error.message : "unknown") + ".";
				}
				queueRender();
			}

			function stopPlayback(withMessage) {
				playbackRequestId += 1;
				state.startingPlayback = false;
				state.playing = false;
				hardStopTransportAndAudio();
				state.currentStep = -1;
				state.moveTick = 0;
				state.drumTick = 0;
				state.voiceModIndex = 0;
				state.voiceModResetCount = 0;
				state.voiceModStepCount = 0;
				if (withMessage) {
					state.message = "Loop stopped.";
				}
				queueRender();
			}

			function advanceSequence(time) {
				if (!state.playing) {
					return;
				}
				const events = [];
				state.boardState.activeKeys = [];

				const tpm = state.ticksPerMove || 1;
				const isMoveTick = state.moveTick % tpm === 0;
				let skipActions = false; // true on reset/start so bots appear at spawn first

				if (state.currentStep === -1) {
					state.currentStep = 0;
					state.drumTick = 0;
					state.moveTick = 0;
					skipActions = true; // show bots at start before first move
				} else if (isMoveTick) {
					const nextStep = state.currentStep + 1;

					// "loop" trigger: advance voice mod based on frequency
					if (state.voiceModTrigger === "loop") {
						state.voiceModStepCount += 1;
						const threshold = Math.max(1, Math.round(state.voiceModLoopFreq * state.loopLength));
						if (state.voiceModStepCount >= threshold) {
							state.voiceModStepCount = 0;
							advanceVoiceMod();
						}
					}

					if (nextStep >= state.loopLength) {
						state.cycle += 1;
						playEventSound("reset", time);
						// Process any deferred deaths before board reset wipes dying flag
						["A", "B"].forEach((botId) => {
							if (state.boardState[botId].dying) {
								processDeath(botId, events);
								playEventSound("death", time);
							}
						});
						// Apply any queued board change — defer save off audio thread
						if (state.pendingBoard) {
							BOARD.tiles = state.pendingBoard.tiles;
							state.activeBoardId = state.pendingBoard.id;
							state.pendingBoard = null;
							setTimeout(() => { saveState(); }, 0);
						}
						const deathsA = state.boardState.A.deaths;
						const deathsB = state.boardState.B.deaths;
						state.boardState = createBoardState();
						state.boardState.A.deaths = deathsA;
						state.boardState.B.deaths = deathsB;
						state.boardState.activeKeys = [];
						pushEvent(events, "reset", "Loop reset snapped both bots back to the launch pads.");
						state.currentStep = 0;
						state.drumTick = 0;
						state.moveTick = 0;
						state.voiceModStepCount = 0;
						skipActions = true; // show bots at spawn for one tick
					} else {
						state.currentStep = nextStep;
					}
				}

				// Bot actions + sounds only on move ticks (skipped on reset tick)
				if (isMoveTick && !skipActions) {
					const stepIndex = state.currentStep;
					// First: process any deferred deaths from previous step (on-beat)
					["A", "B"].forEach((botId) => {
						if (state.boardState[botId].dying) {
							processDeath(botId, events);
							playEventSound("death", time);
						}
					});
					// Then: normal step actions
					["A", "B"].forEach((botId) => {
						if (state.boardState[botId].dying) return; // just died this tick
						const steps = state.bots[botId].steps || [];
						if (!steps.length) {
							return;
						}
						const progLen = state.bots[botId].programLength || state.loopLength;
						const step = steps[stepIndex % progLen];
						const chance = seededChance(botId, stepIndex, state.cycle, 0);
						if (chance > step.probability) {
							state.boardState[botId].status = "Hesitated this register";
							pushEvent(events, "wait", BOT_META[botId].name + " skipped a planned action.", boardKey(state.boardState[botId].x, state.boardState[botId].y));
							return;
						}
						// Move first, then play sound from final board position
						executeStepAction(botId, step, events);
						// Capture tile at landing position BEFORE belt pushes bot away
						state.boardState[botId].steppedTile = tileAt(state.boardState[botId].x, state.boardState[botId].y);
						applyTileEffects(botId, events);
						checkDeath(botId, events);
						playBoardSound(botId, step, time);
					});

					// ─── LOVE CHECK: bots sharing a tile ───
					if (state.boardState.clashCooldown > 0) state.boardState.clashCooldown--;
					const botA = state.boardState.A;
					const botB = state.boardState.B;
					if (botA.x === botB.x && botA.y === botB.y && !botA.dying && !botB.dying && state.boardState.clashCooldown === 0) {
						state.boardState.loveSteps = (state.boardState.loveSteps || 0) + 1;
						if (state.boardState.loveSteps === 2) {
							// Check no upcoming dash in next step for either bot
							const nextIdx = (stepIndex + 1) % state.loopLength;
							const nextA = (state.bots.A.steps || [])[nextIdx % (state.bots.A.programLength || state.loopLength)];
							const nextB = (state.bots.B.steps || [])[nextIdx % (state.bots.B.programLength || state.loopLength)];
							const dashComing = (nextA && nextA.action === "dash") || (nextB && nextB.action === "dash");
							if (!dashComing) {
								state.boardState.hearts = state.boardState.hearts || [];
								state.boardState.hearts.push({ x: botA.x, y: botA.y, tick: Date.now() });
								pushEvent(events, "love", "Bots lingered together. 💕", boardKey(botA.x, botA.y));
								// Coin chime — scale-quantized to current key
								if (audio?.coin) {
									const modStep = getActiveVoiceModStep();
									const sc = modStep.scale || "major";
									const lo = scaleQuantize(83, sc); // ~B5 quantized
									const hi = scaleQuantize(lo + 5, sc); // a 4th-ish above
									audio.coin.triggerAttackRelease(Tone.Frequency(lo, "midi").toNote(), 0.06, time, 0.7);
									audio.coin.triggerAttackRelease(Tone.Frequency(hi, "midi").toNote(), 0.08, time + 0.07, 0.8);
								}
							}
						}
					} else {
						state.boardState.loveSteps = 0;
					}

				} else if (tpm > 1) {
					// Ghost ticks: fill non-move ticks with echo/arp textures
					const tickPhase = state.moveTick % tpm;
					playGhostTick(time, tickPhase, tpm);
				}
				// Drum machine playback — pattern stays locked to move ticks (bot steps)
				// so kick/snare always land on the beat regardless of tpm.
				// Ghost ticks get a light hihat subdivision for rhythmic continuity.
				if (state.drums.on && audio?.drums) {
					if (isMoveTick) {
						playDrumStep(state.drumTick, time);
						state.drumTick = (state.drumTick + 1) % getDrumSteps();
					} else if (tpm > 1) {
						// Ghost tick subdivision: soft hihat on off-beats
						const tickPhase = state.moveTick % tpm;
						const ghostHihatVel = tickPhase === Math.floor(tpm / 2) ? 0.25 : 0.12;
						audio.drums.hihat.triggerAttackRelease(0.02, time, ghostHihatVel);
					}
				} else if (isMoveTick) {
					state.drumTick = (state.drumTick + 1) % getDrumSteps();
				}
				state.moveTick += 1;
				let fxOffsetIndex = 0;
				events.slice(0, MAX_EVENT_SOUNDS_PER_TICK).forEach((event) => {
					if (event.kind === "death") return; // already played directly
					playEventSound(event.kind, time + fxOffsetIndex * 0.01);
					fxOffsetIndex += 1;
				});
				state.boardState.events = events.slice(0, 6);

				/* Schedule visual update via Tone.Draw so it syncs with
				   audio but runs on the main thread outside the audio
				   callback. This prevents DOM work from blocking the
				   audio scheduling and causing timing jitter. */
				Tone.Draw.schedule(() => {
					throttledRender();
				}, time);
			}

			function updateStep(botId, index, patch) {
				state.bots[botId].steps[index] = {
					...state.bots[botId].steps[index],
					...patch,
				};
				saveState();
				queueRender();
			}

			function cycleProbability(botId, index) {
				const current = state.bots[botId].steps[index].probability;
				const position = PROB_OPTIONS.indexOf(current);
				const next = PROB_OPTIONS[(position + 1) % PROB_OPTIONS.length];
				updateStep(botId, index, { probability: next });
			}



			function cycleAction(botId, index) {
				const current = state.bots[botId].steps[index].action;
				const actionIndex = ACTIONS.findIndex((item) => item.id === current);
				const next = ACTIONS[(actionIndex + 1) % ACTIONS.length];
				updateStep(botId, index, { action: next.id });
			}

			function cycleModifier(botId, index) {
				const current = state.bots[botId].steps[index].modifier;
				const modIndex = MODIFIERS.findIndex((item) => item.id === current);
				const next = MODIFIERS[(modIndex + 1) % MODIFIERS.length];
				updateStep(botId, index, { modifier: next.id });
			}

			function setLoopLength(value) {
				const prevDrumSteps = getDrumSteps();
				state.loopLength = value;
				// Cap program lengths to new loop length
				["A", "B"].forEach((id) => {
					if ((state.bots[id].programLength || value) > value) {
						state.bots[id].programLength = value;
					}
				});
				// Re-apply drum preset when step count changes (e.g. 16 ↔ 12)
				const newDrumSteps = getDrumSteps();
				if (newDrumSteps !== prevDrumSteps) {
					const preset = DRUM_PRESETS.find(p => p.id === state.drums.presetId);
					if (preset) {
						state.drums.pattern = preset.pattern(newDrumSteps);
					}
					state.drumTick = 0;
				}
				stopPlayback(false);
				resetBoardState(false);
				saveState();
				state.message = "Loop length set to " + value + " registers.";
				queueRender();
			}

			function setProgramLength(botId, value) {
				const clamped = Math.min(value, state.loopLength);
				state.bots[botId].programLength = clamped;
				saveState();
				state.message = BOT_META[botId].name + " program length set to " + clamped + ".";
				queueRender();
			}

			function cycleScale() {
				const currentIndex = SCALE_OPTIONS.indexOf(state.scale);
				const nextIndex = (currentIndex + 1) % SCALE_OPTIONS.length;
				state.scale = SCALE_OPTIONS[nextIndex < 0 ? 0 : nextIndex];
				saveState();
				state.message = "Scale set to " + state.scale + ".";
				queueRender();
			}

			function toggleQuarterSpeed() {
				state.playbackRate = state.playbackRate === 0.25 ? 1 : 0.25;
				if (window.Tone) {
					Tone.Transport.bpm.rampTo(getPlaybackBpm(), 0.04);
				}
				saveState();
				state.message = state.playbackRate === 0.25 ? "Playback speed set to 1/4." : "Playback speed set to normal.";
				queueRender();
			}

			function toggleRootTranspose() {
				state.transposeWithRoot = !state.transposeWithRoot;
				saveState();
				state.message = state.transposeWithRoot
					? "Root now transposes the sequence."
					: "Root no longer transposes the sequence.";
				queueRender();
			}



			function advanceVoiceMod() {
				const prevIndex = state.voiceModIndex;
				state.voiceModIndex = (state.voiceModIndex + 1) % state.bassMod.length;
				state.voiceModResetCount = 0;

				// Activate pending Seq 2 when Seq 1 wraps
				if (state.voiceModIndex === 0 && prevIndex !== 0 && state.seq2.pendingActive) {
					state.seq2.active = true;
					state.seq2.pendingActive = false;
					state.seq2.index = -1; // will advance to 0 below
					state.message = "Seq 2 activated.";
				}

				// Advance Seq 2 when Seq 1 wraps back to step 0
				if (state.voiceModIndex === 0 && prevIndex !== 0 && state.seq2.active) {
					advanceSeq2();
				}
			}

			function advanceSeq2() {
				const prevIndex = state.seq2.index;
				state.seq2.index = (state.seq2.index + 1) % state.seq2.steps.length;
				const step = state.seq2.steps[state.seq2.index];

				// Apply board change (already deferred via pendingBoard during playback)
				if (step.boardId && step.boardId !== "--") {
					if (step.boardId === "user") {
						loadUserBoard();
					} else {
						applyBoardPreset(step.boardId);
					}
				}
				// Apply drum preset inline (no pushUndo/saveState — we're in audio callback)
				if (step.drumPresetId && step.drumPresetId !== "--") {
					const preset = DRUM_PRESETS.find(p => p.id === step.drumPresetId);
					if (preset) {
						state.drums.presetId = step.drumPresetId;
						state.drums.pattern = preset.pattern(getDrumSteps());
					}
				}
				// Apply register swap
				if (typeof step.regSwap === "boolean" && step.regSwap !== state.registersSwapped) {
					swapRegisters();
				}
				// Randomize bot registers when Seq 2 wraps back to step 0
				// Deferred to main thread so heavy JSON work doesn't block audio
				if (state.seq2.index === 0 && prevIndex !== 0) {
					const rndA = state.seq2.rndBotA;
					const rndB = state.seq2.rndBotB;
					if (rndA || rndB) {
						setTimeout(() => {
							if (rndA) randomizeSteps("A");
							if (rndB) randomizeSteps("B");
						}, 0);
					}
				}
				// Defer save off audio thread
				setTimeout(() => { saveState(); }, 0);
			}

			function cycleVoiceModTrigger() {
				const ids = VOICE_MOD_TRIGGERS.map(t => t.id);
				const idx = ids.indexOf(state.voiceModTrigger);
				state.voiceModTrigger = ids[(idx + 1) % ids.length];
				state.voiceModResetCount = 0;
				state.voiceModStepCount = 0;
				const info = VOICE_MOD_TRIGGERS.find(t => t.id === state.voiceModTrigger);
				saveState();
				state.message = "Sequencer trigger: " + info.label + " — " + info.blurb;
				queueRender();
			}

			function cycleVoiceModLoopFreq() {
				const idx = VOICE_MOD_LOOP_FREQ_OPTIONS.indexOf(state.voiceModLoopFreq);
				state.voiceModLoopFreq = VOICE_MOD_LOOP_FREQ_OPTIONS[(idx + 1) % VOICE_MOD_LOOP_FREQ_OPTIONS.length];
				state.voiceModStepCount = 0;
				saveState();
				const labels = { 0.25: "¼ loop", 0.5: "½ loop", 1: "1 loop", 2: "2 loops", 4: "4 loops" };
				state.message = "Sequencer advances every " + (labels[state.voiceModLoopFreq] || state.voiceModLoopFreq) + ".";
				queueRender();
			}

			function updateBassModStep(index, patch) {
				state.bassMod.steps[index] = {
					...state.bassMod.steps[index],
					...patch,
				};
				saveState();
				queueRender();
			}

			function cycleBassModStepValue(index, field, direction) {
				const step = state.bassMod.steps[index];
				if (!step) {
					return;
				}
				if (field === "scale") {
					let at = SCALE_OPTIONS.indexOf(step.scale);
					if (at < 0) {
						at = 0;
					}
					const next = SCALE_OPTIONS[(at + direction + SCALE_OPTIONS.length) % SCALE_OPTIONS.length];
					updateBassModStep(index, { scale: next });
					return;
				}
				if (field === "root") {
					const next = (step.root + direction + ROOT_NAMES.length) % ROOT_NAMES.length;
					updateBassModStep(index, { root: next });
					return;
				}
				if (field === "semitone") {
					let at = BASS_INTERVAL_OPTIONS.indexOf(step.semitone);
					if (at < 0) {
						at = 0;
					}
					const next = BASS_INTERVAL_OPTIONS[(at + direction + BASS_INTERVAL_OPTIONS.length) % BASS_INTERVAL_OPTIONS.length];
					updateBassModStep(index, { semitone: next });
				}
			}

			function resetBassMod() {
				state.bassMod = { length: 4, steps: buildBassModSteps() };
				saveState();
				state.message = "Seq 1 reset.";
				queueRender();
			}

			function randomizeBassMod() {
				pushUndo();
				const scalePool = SCALE_OPTIONS;
				for (let i = 0; i < state.bassMod.length; i++) {
					state.bassMod.steps[i] = {
						scale: scalePool[Math.floor(Math.random() * scalePool.length)],
						root: Math.floor(Math.random() * 12),
						semitone: Math.floor(Math.random() * 7) - 3,
					};
				}
				saveState();
				state.message = "Seq 1 randomized.";
				queueRender();
			}

			function resetSeq2() {
				state.seq2 = { active: state.seq2.active, index: 0, steps: buildSeq2Steps(), rndBotA: state.seq2.rndBotA, rndBotB: state.seq2.rndBotB };
				saveState();
				state.message = "Seq 2 reset.";
				queueRender();
			}

			function randomizeSeq2() {
				pushUndo();
				const boardPool = ["--", ...BOARD_PRESETS.map(p => p.id)];
				const drumPool = ["--", ...DRUM_PRESETS.map(p => p.id)];
				for (let i = 0; i < state.seq2.steps.length; i++) {
					state.seq2.steps[i] = {
						boardId: boardPool[Math.floor(Math.random() * boardPool.length)],
						drumPresetId: drumPool[Math.floor(Math.random() * drumPool.length)],
						regSwap: Math.random() < 0.3,
					};
				}
				saveState();
				state.message = "Seq 2 randomized.";
				queueRender();
			}

			function randomizeSteps(botId) {
				pushUndo();
				const actionIds = ACTIONS.map(a => a.id);
				const modIds = MODIFIERS.map(m => m.id);

				// Early steps (0–2): weighted toward movement to escape the corner.
				// Later steps: fully random. Keeps variety while ensuring useful openings.
				const earlyPool = [
					"move", "move", "move", "move",   // 4× forward
					"dash", "dash",                     // 2× dash
					"turnL", "turnR",                   // 1× each turn
				];

				state.bots[botId].steps = state.bots[botId].steps.map((_, i) => {
					let action;
					if (i < 3) {
						// First 3 steps: pick from movement-heavy pool
						action = earlyPool[Math.floor(Math.random() * earlyPool.length)];
					} else {
						action = actionIds[Math.floor(Math.random() * actionIds.length)];
					}
					return {
						action,
						repeat: 1,
						probability: Math.random() < 0.1 ? 0.75 : 1,
						modifier: modIds[Math.floor(Math.random() * modIds.length)],
					};
				});
				saveState();
				state.message = BOT_META[botId].name + " registers randomized.";
				queueRender();
			}

			function randomizeAllSteps() {
				randomizeSteps("A");
				randomizeSteps("B");
				state.message = "Both bot registers randomized.";
				queueRender();
			}

			function resetAllSteps() {
				pushUndo();
				state.bots.A.steps = buildSteps();
				state.bots.B.steps = buildSteps();
				saveState();
				state.message = "All registers cleared.";
				queueRender();
			}

			function applyBoardPreset(presetId) {
				const preset = BOARD_PRESETS.find(p => p.id === presetId);
				if (!preset) return;
				if (state.playing) {
					// Queue for next loop reset — don't interrupt playback
					// No queueRender here: the audio callback renders via Tone.Draw
					state.pendingBoard = { tiles: { ...preset.tiles }, id: presetId };
					state.message = preset.label + " board queued — changes on next loop.";
					return;
				}
				BOARD.tiles = { ...preset.tiles };
				state.activeBoardId = presetId;
				resetBoardState(false);
				saveState();
				state.message = preset.label + " board loaded.";
				queueRender();
			}

			function randomizeBoard() {
				const tileTypes = [
					() => ({ type: "belt", dir: ["N","E","S","W"][Math.floor(Math.random()*4)], symbol: "⇢", label: "Belt" }),
					() => ({ type: "zap", symbol: "⚡", label: "Zap Rail" }),
					() => ({ type: "pulse", symbol: "◎", label: "Pulse Pad" }),
					() => ({ type: "rotL", symbol: "↺", label: "Rotate Left" }),
					() => ({ type: "rotR", symbol: "↻", label: "Rotate Right" }),
					() => ({ type: "block", symbol: "■", label: "Crate" }),
				];
				const tiles = {};
				const density = clampNumber(state.boardRandomDensity, 0.25, 0.7, 0.45);
				const startA = BOARD.starts.A.x + "," + BOARD.starts.A.y;
				const startB = BOARD.starts.B.x + "," + BOARD.starts.B.y;
				const maxBlocks = density >= 0.6 ? 5 : density >= 0.45 ? 4 : 3;
				let blockCount = 0;
				for (let y = 0; y < BOARD.rows; y++) {
					for (let x = 0; x < BOARD.cols; x++) {
						const key = x + "," + y;
						if (key === startA || key === startB) continue;
						if (Math.random() < density) {
							const maker = tileTypes[Math.floor(Math.random() * tileTypes.length)];
							const tile = maker();
							if (tile.type === "block" && blockCount >= maxBlocks) continue;
							if (tile.type === "block") blockCount++;
							tiles[key] = tile;
						}
					}
				}
				const mode = density >= 0.6 ? "Chaos" : density >= 0.45 ? "Balanced" : "Sparse";
				if (state.playing) {
					// Queue for next loop reset — don't interrupt playback
					// No queueRender: audio callback renders via Tone.Draw; UI click handler renders after
					state.pendingBoard = { tiles: tiles, id: "random" };
					state.message = "Board randomized — changes on next loop. (" + mode + ", " + Object.keys(tiles).length + " tiles).";
					return;
				}
				BOARD.tiles = tiles;
				state.activeBoardId = "random";
				resetBoardState(false);
				saveState();
				state.message = "Board randomized (" + mode + ", " + Object.keys(tiles).length + " tiles).";
				queueRender();
			}

			function cycleBoardDensity() {
				const options = [0.3, 0.45, 0.6];
				const current = clampNumber(state.boardRandomDensity, 0.25, 0.7, 0.45);
				const idx = options.findIndex((v) => Math.abs(v - current) < 0.001);
				state.boardRandomDensity = options[(idx + 1 + options.length) % options.length];
				saveState();
				const label = state.boardRandomDensity >= 0.6 ? "Chaos" : state.boardRandomDensity >= 0.45 ? "Balanced" : "Sparse";
				state.message = "Board randomizer mode: " + label + ".";
				queueRender();
			}

			const USER_BOARD_KEY = "roboseq-user-board";

			function getUserBoard() {
				try {
					const raw = localStorage.getItem(USER_BOARD_KEY);
					return raw ? JSON.parse(raw) : null;
				} catch { return null; }
			}

			function saveUserBoard() {
				localStorage.setItem(USER_BOARD_KEY, JSON.stringify({ tiles: { ...BOARD.tiles }, savedAt: Date.now() }));
				state.activeBoardId = "user";
				state.message = "Board saved to USER slot.";
				saveState();
				queueRender();
			}

			function loadUserBoard() {
				const saved = getUserBoard();
				const tiles = saved && saved.tiles ? { ...saved.tiles } : {};
				if (state.playing) {
					state.pendingBoard = { tiles, id: "user" };
					state.message = "USER board queued — changes on next loop.";
					queueRender();
					return;
				}
				BOARD.tiles = tiles;
				state.activeBoardId = "user";
				resetBoardState(false);
				saveState();
				state.message = "USER board loaded" + (Object.keys(tiles).length ? "." : " (empty).");
				queueRender();
			}

			function heartPixelArt() {
				// 9×8 pixel heart — classic game style
				const rows = [
					"  ##  ## ",
					" ########",
					"#########",
					"#########",
					" ####### ",
					"  #####  ",
					"   ###   ",
					"    #    ",
				];
				const px = 4;
				const w = 9 * px, h = 8 * px;
				let rects = '';
				rows.forEach((row, ry) => {
					for (let rx = 0; rx < row.length; rx++) {
						if (row[rx] === '#') {
							// Lighter pink highlight on top two rows
							const fill = ry < 2 ? '#ff8ec4' : '#ff4da6';
							rects += `<rect x="${rx * px}" y="${ry * px}" width="${px}" height="${px}" fill="${fill}"/>`;
						}
					}
				});
				return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="image-rendering:pixelated">${rects}</svg>`;
			}

			function explosionPixelArt(botId) {
				const c = botId === "A" ? "var(--bot-a)" : "var(--bot-b)";
				return `
					<div class="explosion" aria-hidden="true">
						<svg viewBox="0 0 16 16" style="display:block;width:100%;height:100%;image-rendering:pixelated">
							<rect x="7" y="0" width="2" height="2" fill="${c}" />
							<rect x="3" y="2" width="2" height="2" fill="${c}" />
							<rect x="11" y="2" width="2" height="2" fill="${c}" />
							<rect x="0" y="7" width="2" height="2" fill="${c}" />
							<rect x="14" y="7" width="2" height="2" fill="${c}" />
							<rect x="3" y="11" width="2" height="2" fill="${c}" />
							<rect x="11" y="11" width="2" height="2" fill="${c}" />
							<rect x="7" y="14" width="2" height="2" fill="${c}" />
							<rect x="5" y="5" width="6" height="6" fill="#fff" style="animation:explode-flash 0.55s steps(3,end) forwards" />
							<rect x="6" y="6" width="4" height="4" fill="${c}" />
							<rect x="7" y="7" width="2" height="2" fill="#fff" />
						</svg>
					</div>
				`;
			}

			function describeStep(step) {
				const action = ACTIONS.find((item) => item.id === step.action);
				const mod = MODIFIERS.find((item) => item.id === step.modifier);
				return action.icon + " " + action.label + " · x" + step.repeat + " · " + Math.round(step.probability * 100) + "% · " + mod.label;
			}

			function actionLabel(actionId) {
				const item = ACTIONS.find((entry) => entry.id === actionId);
				return item ? item.label : actionId;
			}

				const step = state.currentStep;
				const phaseDots = "";
				const mixerRows = [
					{ key: "master", label: "Master" },
					{ key: "melody", label: "Melody" },
					{ key: "botB", label: "Bot B" },
					{ key: "percussion", label: "Perc" },
					{ key: "fx", label: "FX" },
					{ key: "drums", label: "Drums" },

					<section class="panel transport">
						<div class="header-bar">
							<div class="title-block">
								<h1>ROBOSEQ</h1>
								<div class="hdr-buttons">
									<button class="primary" data-action="toggle-play">${state.playing || state.startingPlayback ? "■ STOP" : "▶ PLAY"}</button>
									<button class="danger" data-action="reset-board"><span style="font-size:1.4em">↺</span></button>
									<button class="warn" data-action="toggle-settings">${state.showSettings ? "✕" : "MIX"}</button>
									<button data-action="toggle-help">?</button>

							</div>
							<div class="hud-bar">
								<div class="hud-chip ${state.playing ? "blink" : ""}"><strong>${state.startingPlayback ? "STARTING" : state.playing ? "◉ LIVE" : "READY"}</strong></div>
								<div class="hud-chip">REG <strong>${step >= 0 ? String(step + 1).padStart(2, "0") : "--"}</strong>/<strong>${state.loopLength}</strong></div>
								<div class="hud-chip">CYC <strong>${String(state.cycle + 1).padStart(2, "0")}</strong></div>
								<div class="hud-chip"><strong>${Math.round(state.bpm * (state.playbackRate || 1))}</strong> BPM</div>
							</div>
						</div>
						<div class="ctrl-group">
							<div class="ctrl-item">
								<span class="ctrl-label">BPM</span>
								<input type="range" min="60" max="168" step="1" value="${state.bpm}" data-input="bpm">
							</div>
							<div class="ctrl-item">
								<span class="ctrl-label">Loop</span>
								<div class="seg-row">
									${LOOP_OPTIONS.map((value) => `<button class="${state.loopLength === value ? "active" : ""}" data-action="loop-length" data-loop="${value}">${value}</button>`).join("")}

							</div>
							<div class="ctrl-item">

												<span>${row.label}</span>
												<input type="range" min="0" max="1" step="0.01" value="${value}" data-input="mixer-${row.key}">

			function renderStatusCards() {
				return `
					<div class="bot-status-grid">
						${["A", "B"].map((botId) => {
							const bot = state.boardState[botId];
							const meta = BOT_META[botId];
							const maxHP = 6;
							const hp = Math.max(0, maxHP - bot.heat);
							const hpPct = Math.round((hp / maxHP) * 100);
							const hpColor = hp <= 2 ? "var(--danger)" : hp <= 4 ? "var(--warn)" : "var(--pulse)";
							const deathTag = bot.deaths > 0 ? `<span style="font-size:8px;opacity:0.7"> DEATHS: ${bot.deaths}</span>` : "";
							const brokenHeart = state.boardState.clashCooldown > 0 ? '<span style="position:absolute;left:-14px;top:50%;transform:translateY(-50%);font-size:10px">💔</span>' : '';
							return `
								<div class="status-card bot-${botId.toLowerCase()}">
									<h4 style="color:${meta.color}">${meta.name} ${dirArrow(bot.dir)}</h4>
									<div class="status-stats">
										<span>${bot.x},${bot.y}${deathTag}</span>
									</div>
									<div style="position:relative;width:100%;height:6px;background:#1a1a2e;border-radius:3px;overflow:visible;margin:2px 0">
										${brokenHeart}
										<div style="width:${hpPct}%;height:100%;background:${hpColor};transition:width 0.2s;border-radius:3px"></div>

									<div class="robot-badge">${robotPixelArt(botId)}</div>
								</div>
							`;
						}).join("")}
					</div>

			}

			function renderBoard() {
				const densityLabel = state.boardRandomDensity >= 0.6 ? "CHAOS" : state.boardRandomDensity >= 0.45 ? "BALANCED" : "SPARSE";
				const cells = [];
				const now = Date.now();
				const explosions = (state.boardState.explosions || []).filter(e => now - e.tick < 700);
				state.boardState.explosions = explosions;
				const hearts = (state.boardState.hearts || []).filter(h => now - h.tick < 700);
				state.boardState.hearts = hearts;
				const activeKeySet = new Set(state.boardState.activeKeys || []);
				const trailA = state.boardState.trailA || [];
				const trailB = state.boardState.trailB || [];
				const trailMapA = Object.create(null);
				const trailMapB = Object.create(null);
				trailA.forEach((k, idx) => { trailMapA[k] = idx; });
				trailB.forEach((k, idx) => { trailMapB[k] = idx; });
				const explosionMap = Object.create(null);
				explosions.forEach((e) => {
					const k = boardKey(e.x, e.y);
					if (!explosionMap[k]) explosionMap[k] = [];
					explosionMap[k].push(e);
				});
				const heartMap = Object.create(null);
				hearts.forEach((h) => {
					if (!h.shown) {
						heartMap[boardKey(h.x, h.y)] = true;
						h.shown = true;
					}
				});
				const clashes = (state.boardState.clashes || []).filter(c => now - c.tick < 500);
				state.boardState.clashes = clashes;
				const clashMap = Object.create(null);
				clashes.forEach((c) => {
					if (!c.shown) {
						const victim = c.attacker === "A" ? "B" : "A";
						clashMap[boardKey(c.x, c.y)] = victim;
						c.shown = true;
					}
				});
				for (let y = 0; y < BOARD.rows; y += 1) {
					for (let x = 0; x < BOARD.cols; x += 1) {
						const key = boardKey(x, y);
						const tile = tileAt(x, y);
						const botsHere = ["A", "B"].filter((botId) => {
							const bot = state.boardState[botId];
							return bot.x === x && bot.y === y && now >= (bot.hiddenUntil || 0);
						});
						const cellExplosions = explosionMap[key] || [];
						const cellHeart = heartMap[key];
						const cellClash = clashMap[key];
						const tileType = tile ? (tile.type === "rotL" || tile.type === "rotR" ? "rotator" : tile.type) : "";
						const activeClass = activeKeySet.has(key) ? "active-cell" : "";
						const aIdx = trailMapA[key];
						const bIdx = trailMapB[key];
						const trailDots = [];
						if (Number.isInteger(aIdx) && !botsHere.includes("A")) {
							const latest = aIdx === trailA.length - 1 ? " trail-latest" : "";
							trailDots.push(`<span class="trail-marker trail-a${latest}" style="width:6px;height:6px;left:2px;bottom:2px"></span>`);
						}
						if (Number.isInteger(bIdx) && !botsHere.includes("B")) {
							const latest = bIdx === trailB.length - 1 ? " trail-latest" : "";
							trailDots.push(`<span class="trail-marker trail-b${latest}" style="width:6px;height:6px;right:2px;bottom:2px"></span>`);
						}
						cells.push(`
							<div class="cell ${tileType} ${activeClass}" title="${tile ? tile.label : "Open tile"}">
								<div class="tile-mark">${tile ? tilePixelArt(tile) : ""}</div>
								${trailDots.join("")}
								<div class="cell-overlay">
									${cellHeart ? '<span class="love-heart">' + heartPixelArt() + '</span>' : ''}
									<div class="cell-overlay-top">
										<div class="cell-coord">${x},${y}</div>
										<div class="cell-coord">${tile ? tile.label : "Open"}</div>
									</div>
									<div class="cell-bot-row">
										${cellExplosions.map((e) => `
											<span class="cell-bot-mini bot-${e.bot.toLowerCase()}">
												<span class="cell-bot-sprite">${explosionPixelArt(e.bot)}</span>
											</span>
										`).join("")}
										${botsHere.map((botId) => `
											<span class="cell-bot-mini bot-${botId.toLowerCase()}" style="position:relative">
												<span class="cell-bot-sprite">${robotPixelArt(botId)}</span>
												${cellClash === botId ? '<span class="dash-clash">' + clashPixelArt() + '</span>' : ''}
												${dirArrow(state.boardState[botId].dir)}
											</span>
										`).join("")}
									</div>
								</div>
							</div>
						`);
					}
				}

				const legend = [
					{ color: "var(--belt)", label: "Belts move bots mid-step" },
					{ color: "var(--rotator)", label: "Rotators twist facing" },
					{ color: "var(--zap)", label: "Zap rails add sparks" },
					{ color: "var(--pulse)", label: "Pulse pads cool the bots" },
				];

				const eventRows = Array.from({ length: 6 }, (_, index) => {
					const event = (state.boardState.events || [])[index];
					if (!event) {
						return `<div class="event-item ev-empty"><strong>--</strong><span>...</span></div>`;
					}
					return `<div class="event-item ev-${event.kind}"><strong>${event.kind.toUpperCase()}</strong><span>${event.label}</span></div>`;
				});

				return `
					<section class="panel board-panel">
						<div class="panel-head">
							<div>
								<h2>▦ Battle Board</h2>
								<div class="panel-copy">5×5. Hazards fire each register. Resets every loop.</div>
							</div>
							<div class="hud-chip">DETERMINISTIC</div>
						</div>
						<div class="btn-row" style="flex-wrap:wrap">
							${BOARD_PRESETS.map(p => {
								const isActive = (state.activeBoardId || 'default') === p.id;
								const isPending = state.pendingBoard && state.pendingBoard.id === p.id;
								const cls = isPending ? 'pending' : isActive ? 'active' : '';
								return `<button class="${cls}" data-action="board-preset" data-preset="${p.id}">${p.label}</button>`;
							}).join("")}
							<button class="warn" data-action="cycle-board-density">${densityLabel}</button>
							<button class="${state.pendingBoard && state.pendingBoard.id === 'random' ? 'pending' : 'warn'}" data-action="randomize-board">⚄ REROLL</button>
						</div>
						<div class="btn-row" style="flex-wrap:wrap;gap:3px">
							<button class="${state.pendingBoard && state.pendingBoard.id === 'user' ? 'pending' : state.activeBoardId === 'user' ? 'active' : ''}" data-action="load-user-board">USER</button>
							<button class="primary" data-action="save-user-board" style="font-size:6px">💾 SAVE</button>
							<button class="warn" data-action="clear-user-board">CLR</button>
						</div>
						${renderStatusCards()}
						<div class="board-wrap">
							<div class="board-grid">${cells.join("")}</div>
							<div class="legend">
								${legend.map((item) => `
									<div class="legend-item"><span class="legend-swatch" style="background:${item.color}"></span><span>${item.label}</span></div>
								`).join("")}
							</div>
							<div class="event-log">
								${eventRows.join("")}
							</div>
						</div>
					</section>
				`;
			}

			function renderStepCard(botId, step, index) {
				const botClass = "bot-" + botId.toLowerCase();
				const current = state.playing && state.currentStep === index ? "current" : "";
				const action = ACTIONS.find((item) => item.id === step.action);
				const mod = MODIFIERS.find((item) => item.id === step.modifier);
				const probPct = Math.round(step.probability * 100);
				const probColor = probPct === 100 ? "var(--accent)" : probPct >= 75 ? "var(--warn)" : "var(--danger)";
				const actionColorMap = {
					move: "var(--pulse)",
					back: "var(--line3)",
					turnL: "var(--rotator)",
					turnR: "var(--belt)",
					dash: "var(--danger)",
					ping: "var(--accent2)",
					wait: "var(--muted)",
				};
				const modColorMap = {
					steady: "var(--muted)",
					bright: "var(--warn)",
					low: "var(--bot-b)",
					wobble: "var(--accent)",
					glitch: "var(--danger)",
				};
				const actionColor = actionColorMap[step.action] || "var(--accent)";
				const modColor = modColorMap[step.modifier] || "var(--text2)";
				return `
					<div class="step-card ${botClass} ${current}" draggable="true" data-drag-bot="${botId}" data-drag-step="${index}">
						<div class="step-top">
							<span class="step-index">${String(index + 1).padStart(2, "0")}</span>
							<button class="action-pick" data-action="cycle-action" data-bot="${botId}" data-step="${index}" style="border-color:${actionColor};color:${actionColor}">${action.icon} ${action.label}</button>
						</div>
						<div class="step-top">
							<button class="quick-btn" data-action="cycle-modifier" data-bot="${botId}" data-step="${index}" style="border-color:${modColor};color:${modColor}">MOD ${mod.label}</button>
							<button class="quick-btn" data-action="cycle-prob" data-bot="${botId}" data-step="${index}" style="border-color:${probColor};color:${probColor}">FIRE ${probPct}%</button>
						</div>
					</div>
				`;
			}

			function renderPlanner() {
				return `
					<section class="panel planner-panel">
						<div class="panel-head">
							<div>
								<h2>▤ Program Registers</h2>
								<div class="panel-copy">Tap a block to cycle command. No dropdowns. Drag to reorder.</div>
							</div>
							<div class="btn-row">
								<button class="warn" data-action="randomize-steps" data-bot="A">⚄ RND A</button>
								<button class="warn" data-action="randomize-steps" data-bot="B">⚄ RND B</button>
								<button class="warn" data-action="randomize-all-steps">⚄ RND ALL</button>
								<button class="${state.registersSwapped ? 'active' : 'warn'}" data-action="swap-registers">⇅ REG SWAP</button>
								<button class="danger" data-action="reset-all-steps">↺ RESET</button>
							</div>
						</div>
						<div class="planner-stack">
							${["A", "B"].map((botId) => {
								const progLen = state.bots[botId].programLength || state.loopLength;
								const progOptions = LOOP_OPTIONS.filter(v => v <= state.loopLength);
								return `
								<section class="bot-card bot-${botId.toLowerCase()}">
									<div class="bot-head">
										<div class="bot-name-with-art">
											<div class="bot-name" style="color:${BOT_META[botId].color}">
												${botId === "A" ? "[A] " : "[B] "}${BOT_META[botId].name}
											</div>
										</div>
										<div class="seg-row" style="gap:2px;font-size:9px">
											${progOptions.map(v => `<button style="min-width:22px;padding:2px 4px;font-size:9px" class="${progLen === v ? "active" : ""}" data-action="program-length" data-bot="${botId}" data-len="${v}">${v}</button>`).join("")}
										</div>
									</div>
									<div class="step-list">

									</div>
								</section>
								`;
							}).join("")}
						</div>
					</section>
				`;
			}

			function renderBassModSequencer() {
				const currentModStep = state.voiceModIndex % state.bassMod.length;
				const freqLabels = { 0.25: "¼×", 0.5: "½×", 1: "1×", 2: "2×", 4: "4×" };
				const freqLabel = freqLabels[state.voiceModLoopFreq] || state.voiceModLoopFreq + "×";
				const triggerInfo = VOICE_MOD_TRIGGERS.find(t => t.id === state.voiceModTrigger);
				if (!state.showVoiceMod) {
					const currentStep = state.bassMod.steps[currentModStep];
					const summaryText = (currentStep ? ROOT_NAMES[currentStep.root] + " " + currentStep.scale : "C major") + " · step " + (currentModStep + 1) + "/" + state.bassMod.length;
					return `
						<div class="bassmod-wrapper">
						<section class="panel bassmod-panel">
							<div class="panel-head" style="cursor:pointer" data-action="toggle-voicemod">
								<div>
									<h2>▩ Sequencer · <small style="color:var(--text2)">${summaryText}</small></h2>
								</div>
								<span style="font-size:10px;color:var(--text2)">▼</span>
							</div>
						</section>
						</div>
					`;
				}
				const resetDots = Array.from({ length: state.bassMod.length }, (_, index) => `
					<span class="dot ${index <= state.voiceModResetCount ? "on" : ""}"></span>
				`).join("");
				const BOARD_SHORT = { "default": "FACT", "corridor": "CORR", "garden": "GRDN", "gauntlet": "GNTL", "spinner": "SPIN", "maze": "MAZE", "user": "USER" };
				const DRUM_SHORT = { "four": "4FL", "break": "BRK", "half": "HLF", "offbeat": "OFF", "triplet": "TRP", "minimal": "MIN" };
				return `
					<div class="bassmod-wrapper">
					<section class="panel bassmod-panel">
						<div class="panel-head">
							<div>
								<h2 style="cursor:pointer" data-action="toggle-voicemod">▩ Seq 1 — Scale ▲</h2>
								<div class="panel-copy">Scale, root &amp; semitone per step. Shifts everything each cycle.</div>
								<div class="bassmod-progress" title="Reset progress">${resetDots}</div>
							</div>
							<div class="btn-row">
								<button class="warn" data-action="cycle-voicemod-trigger">${triggerInfo.label}</button>
								${state.voiceModTrigger === "loop" ? '<button class="warn" data-action="cycle-voicemod-loop-freq">' + freqLabel + '</button>' : ''}
								${state.voiceModTrigger === "manual" ? '<button class="primary" data-action="manual-voicemod-advance">▶ NEXT</button>' : ''}
								<button data-action="toggle-root-transpose">ROOT ${state.transposeWithRoot ? "ON" : "OFF"}</button>
								<button data-action="reset-bassmod">RST</button>
								<button data-action="randomize-bassmod">RND</button>
								<button class="warn" data-action="toggle-voicemod">▲</button>
							</div>
						</div>
						<div class="bassmod-grid">
							<div class="bassmod-step" style="border:none;box-shadow:none;background:none;padding:0 6px">
								<span></span>
								<span class="ctrl-label" style="text-align:center">SCALE</span>
								<span class="ctrl-label" style="text-align:center">ROOT</span>
								<span class="ctrl-label" style="text-align:center">SEMITONE</span>
							</div>
							${state.bassMod.steps.slice(0, state.bassMod.length).map((modStep, index) => {
								return `
								<div class="bassmod-step ${currentModStep === index ? "active" : ""}">
									<span class="step-index ${currentModStep === index ? "live" : ""}">
										${currentModStep === index ? "▶" : ""} ${index + 1}
									</span>
									<div class="bassmod-cycle">

										<div class="bassmod-cycle-value">${modStep.scale}</div>
										<button class="bassmod-cycle-btn" data-action="bass-scale-next" data-step="${index}">▶</button>
									</div>
									<div class="bassmod-cycle">
										<button class="bassmod-cycle-btn" data-action="bass-root-prev" data-step="${index}">◀</button>
										<div class="bassmod-cycle-value">${ROOT_NAMES[modStep.root] || "C"}</div>
										<button class="bassmod-cycle-btn" data-action="bass-root-next" data-step="${index}">▶</button>
									</div>
									<div class="bassmod-cycle">

			function queueRender() {
				if (suspendRender) {
					pendingRender = true;
					return;
				}
				if (renderQueued) {
					return;
				}
				renderQueued = true;
				requestAnimationFrame(() => {
					renderQueued = false;
					if (suspendRender) {
						pendingRender = true;
						return;
					}
					renderApp();
					if (pendingRender) {
						pendingRender = false;
						queueRender();
					}
				});
			}

			/* Throttled render for playback ticks — caps visual updates
			   to ~10 fps so the audio thread stays smooth. Non-playback
			   actions (button clicks, slider changes) still use the
			   instant queueRender path. */
			let lastRenderTime = 0;
			const RENDER_INTERVAL = 120; /* ms between playback renders */
			let renderTimerId = 0;
			function throttledRender() {
				const now = performance.now();
				if (now - lastRenderTime >= RENDER_INTERVAL) {
					lastRenderTime = now;
					queueRender();
				} else if (!renderTimerId) {
					renderTimerId = setTimeout(() => {
						renderTimerId = 0;
						lastRenderTime = performance.now();
						queueRender();
					}, RENDER_INTERVAL - (now - lastRenderTime));
				}
			}

			document.addEventListener("focusin", (event) => {
				if (event.target && (event.target.tagName === "SELECT" || event.target.type === "range")) {
					suspendRender = true;
				}
			});

			document.addEventListener("pointerdown", (event) => {
				if (event.target && (event.target.tagName === "SELECT" || event.target.type === "range")) {
					suspendRender = true;
				}
			});

			document.addEventListener("pointerup", (event) => {
				if (suspendRender && event.target && event.target.type === "range") {
					suspendRender = false;
					if (pendingRender) {
						pendingRender = false;
						queueRender();
					}
				}
			});

			document.addEventListener("focusout", (event) => {
				if (event.target && (event.target.tagName === "SELECT" || event.target.type === "range")) {
					suspendRender = false;
					if (pendingRender) {
						pendingRender = false;
						queueRender();
					}
				}
			});

			/* STOP must fire on pointerdown so it works even when
			   rapid re-renders (queueRender during playback) replace
			   button DOM between mousedown and click events. */
			let _pointerGateTimer = 0;
			let _pointerStoppedPlay = false;
			document.addEventListener("pointerdown", (event) => {
				const target = event.target.closest("[data-action]");
				if (!target) return;

				/* Briefly suspend rendering so the DOM isn't replaced
				   between pointerdown and the resulting click event.
				   This is the root cause of "unresponsive buttons"
				   during playback — the rAF innerHTML swap destroys
				   the element before click fires. */
				if (state.playing && !suspendRender) {
					suspendRender = true;
					clearTimeout(_pointerGateTimer);
					_pointerGateTimer = setTimeout(() => {
						suspendRender = false;
						if (pendingRender) {
							pendingRender = false;
							queueRender();
						}
					}, 250);
				}

				if (target.dataset.action === "toggle-play") {
					const transportRunning = Boolean(window.Tone && Tone.Transport.state === "started");
					if (state.playing || state.startingPlayback || transportRunning) {
						event.preventDefault();
						_pointerStoppedPlay = true;
						stopPlayback(true);
					}
				}
			}, true);

			document.addEventListener("click", async (event) => {
				const target = event.target.closest("[data-action]");
				if (!target) {
					return;
				}
				/* During playback, rapid innerHTML re-renders can detach the
				   element between pointerdown and click. Bail early and let the
				   pointerup handler below take over in that case. */
				if (!target.isConnected) return;
				const action = target.dataset.action;
				if (action === "close-tutorial") {
					state.showTutorial = false;
					queueRender();
					return;
				}
				if (action === "toggle-help") {
					state.showHelp = !state.showHelp;
					queueRender();
					return;
				}
				if (action === "toggle-drums") {
					state.showDrums = !state.showDrums;
					saveState();
					queueRender();
					return;
				}
				if (action === "toggle-drums-on") {
					state.drums.on = !state.drums.on;
					saveState();
					state.message = state.drums.on ? "Drums ON." : "Drums OFF.";
					queueRender();
					return;
				}
				if (action === "drum-preset") {
					applyDrumPreset(target.dataset.preset);
					return;
				}
				if (action === "drum-cell") {
					toggleDrumCell(target.dataset.voice, Number(target.dataset.step));
					return;
				}
				if (action === "clear-drums") {
					clearDrumPattern();
					return;
				}
				if (action === "board-preset") {
					applyBoardPreset(target.dataset.preset);
					queueRender();
					return;
				}
				if (action === "randomize-board") {
					pushUndo();
					randomizeBoard();
					queueRender();
					return;
				}
				if (action === "cycle-board-density") {
					cycleBoardDensity();
					return;
				}
				if (action === "save-user-board") {
					pushUndo();
					saveUserBoard();
					return;
				}
				if (action === "load-user-board") {
					pushUndo();
					loadUserBoard();
					return;
				}
				if (action === "clear-user-board") {
					localStorage.removeItem(USER_BOARD_KEY);
					state.message = "USER board cleared.";
					if (state.activeBoardId === "user") {
						pushUndo();
						loadUserBoard();
					} else {
						queueRender();
					}
					return;
				}
				if (action === "randomize-steps") {
					randomizeSteps(target.dataset.bot);
					queueRender();
					return;
				}
				if (action === "randomize-all-steps") {
					randomizeAllSteps();
					return;
				}
				if (action === "reset-all-steps") {
					resetAllSteps();
					return;
				}
				if (action === "toggle-play") {
					/* If pointerdown already stopped playback, don't restart */
					if (_pointerStoppedPlay) {
						_pointerStoppedPlay = false;
						return;
					}
					const transportRunning = Boolean(window.Tone && Tone.Transport.state === "started");
					if (state.playing || state.startingPlayback || transportRunning) {
						stopPlayback(true);
						return;
					}
					/* play — armAudio is called internally by startPlayback */
					await startPlayback();
					return;
				}
				if (action === "reset-board") {
					resetBoardState(true);
					queueRender();
					return;
				}
				if (action === "loop-length") {
					setLoopLength(Number(target.dataset.loop));
					return;
				}
				if (action === "program-length") {
					setProgramLength(target.dataset.bot, Number(target.dataset.len));
					return;
				}
				if (action === "ticks-per-move") {
					const val = Number(target.dataset.ticks);
					if ([1, 2, 4].includes(val)) {
						state.ticksPerMove = val;
						state.moveTick = 0;
						if (window.Tone && Tone.Transport.state === "started") {
							Tone.Transport.bpm.rampTo(getPlaybackBpm(), 0.05);
						}
						state.message = "Bots move every " + val + " tick" + (val > 1 ? "s" : "") + ".";
						saveState();
						queueRender();
					}
					return;
				}
				if (action === "toggle-quarter-speed") {
					toggleQuarterSpeed();
					return;
				}
					if (action === "toggle-settings") {
						state.showSettings = !state.showSettings;
						queueRender();
						return;
					}
				if (action === "cycle-scale") {
					cycleScale();
					return;
				}
				if (action === "swap-registers") {
					swapRegisters();
					return;
				}
					if (action === "cycle-voicemod-trigger") {
						cycleVoiceModTrigger();
						return;
					}
					if (action === "cycle-voicemod-loop-freq") {
						cycleVoiceModLoopFreq();
						return;
					}
					if (action === "toggle-voicemod") {
						state.showVoiceMod = !state.showVoiceMod;
						saveState();
						queueRender();
						return;
					}
					if (action === "manual-voicemod-advance") {
						advanceVoiceMod();
						saveState();
						state.message = "Sequencer → step " + (state.voiceModIndex + 1) + ".";
						queueRender();
						return;
					}
					if (action === "toggle-root-transpose") {
						toggleRootTranspose();
						return;
					}
					if (action === "bass-scale-prev") {
						cycleBassModStepValue(Number(target.dataset.step), "scale", -1);
						return;
					}
					if (action === "bass-scale-next") {
						cycleBassModStepValue(Number(target.dataset.step), "scale", 1);
						return;
					}
					if (action === "bass-root-prev") {
						cycleBassModStepValue(Number(target.dataset.step), "root", -1);
						return;
					}
					if (action === "bass-root-next") {
						cycleBassModStepValue(Number(target.dataset.step), "root", 1);
						return;
					}
					if (action === "bass-interval-prev") {
						cycleBassModStepValue(Number(target.dataset.step), "semitone", -1);
						return;
					}
					if (action === "bass-interval-next") {
						cycleBassModStepValue(Number(target.dataset.step), "semitone", 1);
						return;
					}
					if (action === "seq2-board-prev" || action === "seq2-board-next") {
						const stepIdx = Number(target.dataset.step);
						const step = state.seq2.steps[stepIdx];
						const boardIds = ["--", ...BOARD_PRESETS.map(p => p.id), "user"];
						const cur = boardIds.indexOf(step.boardId || "--");
						const dir = action === "seq2-board-next" ? 1 : -1;
						const next = boardIds[(cur + dir + boardIds.length) % boardIds.length];
						pushUndo();
						state.seq2.steps[stepIdx] = { ...step, boardId: next };
						saveState();
						queueRender();
						return;
					}
					if (action === "seq2-drum-prev" || action === "seq2-drum-next") {
						const stepIdx = Number(target.dataset.step);
						const step = state.seq2.steps[stepIdx];
						const drumIds = ["--", ...DRUM_PRESETS.map(p => p.id)];
						const cur = drumIds.indexOf(step.drumPresetId || "--");
						const dir = action === "seq2-drum-next" ? 1 : -1;
						const next = drumIds[(cur + dir + drumIds.length) % drumIds.length];
						pushUndo();
						state.seq2.steps[stepIdx] = { ...step, drumPresetId: next };
						saveState();
						queueRender();
						return;
					}
					if (action === "seq2-regswap-toggle") {
						const stepIdx = Number(target.dataset.step);
						const step = state.seq2.steps[stepIdx];
						pushUndo();
						state.seq2.steps[stepIdx] = { ...step, regSwap: !step.regSwap };
						saveState();
						queueRender();
						return;
					}
					if (action === "seq2-toggle-active") {
						pushUndo();
						if (!state.seq2.active && !state.seq2.pendingActive) {
							// Turning ON
							if (state.playing) {
								state.seq2.pendingActive = true;
								state.message = "Seq 2 queued — starts on next Seq 1 wrap.";
							} else {
								state.seq2.active = true;
								state.message = "Seq 2 active.";
							}
						} else {
							// Turning OFF (or cancelling pending)
							state.seq2.active = false;
							state.seq2.pendingActive = false;
							state.message = "Seq 2 off.";
						}
						saveState();
						queueRender();
						return;
					}
					if (action === "seq2-toggle-rnd-a") {
						state.seq2.rndBotA = !state.seq2.rndBotA;
						saveState();
						state.message = "Seq 2 cycle → randomize Bot A: " + (state.seq2.rndBotA ? "ON" : "OFF");
						queueRender();
						return;
					}
					if (action === "seq2-toggle-rnd-b") {
						state.seq2.rndBotB = !state.seq2.rndBotB;
						saveState();
						state.message = "Seq 2 cycle → randomize Bot B: " + (state.seq2.rndBotB ? "ON" : "OFF");
						queueRender();
						return;
					}
					if (action === "reset-seq2") {
						resetSeq2();
						return;
					}
					if (action === "randomize-seq2") {
						randomizeSeq2();
						return;
					}
					if (action === "reset-bassmod") {
						resetBassMod();
						return;
					}
					if (action === "randomize-bassmod") {
						randomizeBassMod();
						return;
					}

				if (action === "cycle-prob") {
					cycleProbability(target.dataset.bot, Number(target.dataset.step));
					return;
				}
				if (action === "cycle-action") {
					cycleAction(target.dataset.bot, Number(target.dataset.step));
					return;
				}
				if (action === "cycle-modifier") {
					cycleModifier(target.dataset.bot, Number(target.dataset.step));
					return;
				}

			});

			document.addEventListener("input", (event) => {
				if (event.target.dataset.input === "bpm") {
					state.bpm = Number(event.target.value);
					if (window.Tone) {
						Tone.Transport.bpm.rampTo(getPlaybackBpm(), 0.05);
					}
					saveState();
					queueRender();
						return;
					}
					if (event.target.dataset.input && event.target.dataset.input.startsWith("mixer-")) {
						const key = event.target.dataset.input.replace("mixer-", "");
						setMixerValue(key, Number(event.target.value));
				}
			});

			/* ─── DRAG & DROP HANDLERS ─────────────────────────────────────────── */
			document.addEventListener("dragstart", (event) => {
				const card = event.target.closest("[data-drag-bot]");
				if (!card) return;
				const botId = card.dataset.dragBot;
				const fromIndex = Number(card.dataset.dragStep);
				dragState = { source: card, botId, fromIndex };
				card.classList.add("dragging");
				event.dataTransfer.effectAllowed = "move";
				event.dataTransfer.setData("text/plain", `${botId}:${fromIndex}`);
				// Add visual feedback
				const list = card.closest(".step-list");
				if (list) list.classList.add("drag-active");
			});

			document.addEventListener("dragend", (event) => {
				const card = event.target.closest("[data-drag-bot]");
				if (!card) return;
				card.classList.remove("dragging");
				document.querySelectorAll(".step-card").forEach(c => c.classList.remove("drag-over"));
				document.querySelectorAll(".step-list").forEach(l => l.classList.remove("drag-active"));
				dragState = { source: null, botId: null, fromIndex: null };
			});

			document.addEventListener("dragover", (event) => {
				event.preventDefault();
				event.dataTransfer.dropEffect = "move";
				const targetCard = event.target.closest("[data-drag-bot]");
				if (targetCard && targetCard !== dragState.source) {
					targetCard.classList.add("drag-over");
				}
			});

			document.addEventListener("dragleave", (event) => {
				const targetCard = event.target.closest("[data-drag-bot]");
				if (targetCard) {
					targetCard.classList.remove("drag-over");
				}
			});

			document.addEventListener("drop", (event) => {
				event.preventDefault();
				const targetCard = event.target.closest("[data-drag-bot]");
				if (!targetCard || !dragState.botId) return;
				
				targetCard.classList.remove("drag-over");
				const targetBotId = targetCard.dataset.dragBot;
				const toIndex = Number(targetCard.dataset.dragStep);
				
				// Only allow reordering within same bot
				if (dragState.botId !== targetBotId || dragState.fromIndex === toIndex) {
					return;
				}
				
				// Swap the steps
				const steps = state.bots[dragState.botId].steps;
				const temp = steps[dragState.fromIndex];
				if (toIndex > dragState.fromIndex) {
					// Moving down
					for (let i = dragState.fromIndex; i < toIndex; i++) {
						steps[i] = steps[i + 1];
					}
				} else {
					// Moving up
					for (let i = dragState.fromIndex; i > toIndex; i--) {
						steps[i] = steps[i - 1];
					}
				}
				steps[toIndex] = temp;
				
				saveState();
				queueRender();
			});

			document.addEventListener("change", (event) => {
				const target = event.target;
				if (target && target.tagName === "SELECT") {
					suspendRender = false;
					if (pendingRender) {
						pendingRender = false;
						queueRender();
					}
				}
				if (!target.dataset.select) {
					return;
				}
					if (target.dataset.select.startsWith("bass-")) {
						const stepIndex = Number(target.dataset.step);
						if (target.dataset.select === "bass-scale") {
							updateBassModStep(stepIndex, { scale: target.value });
						}
						if (target.dataset.select === "bass-root") {
							updateBassModStep(stepIndex, { root: Number(target.value) });
						}
						if (target.dataset.select === "bass-semitone") {
							updateBassModStep(stepIndex, { semitone: Number(target.value) });
						}
						return;
					}
				const botId = target.dataset.bot;
				const stepIndex = Number(target.dataset.step);
				if (target.dataset.select === "action") {
					updateStep(botId, stepIndex, { action: target.value });
				}
				if (target.dataset.select === "modifier") {
					updateStep(botId, stepIndex, { modifier: target.value });
				}
			});

			document.addEventListener("keydown", async (event) => {
				const tag = (document.activeElement || {}).tagName;
				if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
				const key = event.key;
				if (key === "s" || key === "S" || key === " ") {
					event.preventDefault();
					const transportRunning = Boolean(window.Tone && Tone.Transport.state === "started");
					if (state.playing || state.startingPlayback || transportRunning) {
						stopPlayback(true);
					} else {
						await startPlayback();
					}
					return;
				}
				if (key === "r" || key === "R") {
					event.preventDefault();
					randomizeAllSteps();
					return;
				}
				if (key === "u" || key === "U") {
					event.preventDefault();
					popUndo();
					return;
				}
			});

			renderApp();
		})();
	</script>
	<div style="position:fixed;right:8px;bottom:6px;z-index:9999;font:9px/1 'Press Start 2P',monospace;color:rgba(143,255,209,.82);letter-spacing:.04em;text-transform:lowercase;pointer-events:none;user-select:none;">work in progress</div>
</body>
