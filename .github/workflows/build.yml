# Every push and pull request: the host tests, Dinghy's platform tests and the real FM-1 package, built and attested
# by the shared zvenson/fm1-build workflow (JieLi toolchain + AC79 SDK), as SkurkyMello does. A tag vX.Y also
# publishes the release. On main also the page (the site job below).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
      test: sh tests/run_roboseq.sh && sh tests/run_host.sh && sh tests/run_tests.sh
      packages: build/roboseq*.fwsc

  # The page (GitHub Pages, https://joakimskurk.github.io/fm1roboseq/): RoboSeq's page and its installer in the
  # browser (Web MIDI), with the package this run built and tested, the demos the app plays on the host, and RoboSeq
  # to play in the browser (web/render_demos.sh, web/app/build.sh, web/make_site.py). From main only, as Star Distroyer's, VaveHero's and FM-1 Clock's. GitHub
  # Pages takes its site from GitHub Actions (Settings -> Pages); while it is off this job says so and publishes
  # nothing (the build stays green).
  site:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages is off::Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then run the build again"
            echo "on=0" >> "$GITHUB_OUTPUT"
          fi
      - name: ffmpeg, numpy and Pillow (the audio, the spectra); clang and lld (RoboSeq for the browser)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil clang lld
      - name: The demos (the app on the host)
        run: sh web/render_demos.sh
      - name: RoboSeq to play on the page (the firmware's own code, WebAssembly)
        run: sh web/app/build.sh
      - name: The site
        run: python3 web/make_site.py build/roboseq.fwsc "dev-${GITHUB_SHA::7}" _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == '1'
        with:
          path: _site
      - id: deploy
        if: steps.pages.outputs.on == '1'
        uses: actions/deploy-pages@v4
